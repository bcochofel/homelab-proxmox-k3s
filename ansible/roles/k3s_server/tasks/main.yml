---
# tasks file for k3s_server — installs K3s in server (control-plane) mode
# via the official install script, pinned to k3s_version (group_vars/
# all.yml). Idempotent via `creates=`: a re-run against an already-
# installed node is a no-op.
#
# Single-server topology today (see terraform/variables.tf's
# k3s_server_nodes default) — no --cluster-init/HA embedded-etcd join
# logic here. If k3s_server_nodes ever grows to 3+ for HA, this task needs
# `--cluster-init` on the first server and `--server https://<first>:6443`
# joins for the rest; tracked in TODO.md, not built ahead of need.
#
# --flannel-backend=none/--disable-network-policy/--disable-kube-proxy:
# Cilium replaces K3s' bundled Flannel + kube-proxy entirely (see
# CLAUDE.md) — installed by the `cilium` role right after this one, before
# agents join. Server-only flags: K3s propagates the "no flannel/no
# kube-proxy" state cluster-wide from the server, agents don't take a
# matching flag.

- name: Download and run the K3s server install script
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      INSTALL_K3S_EXEC="server --flannel-backend=none --disable-network-policy --disable-kube-proxy" \
      sh -
  args:
    creates: /usr/local/bin/k3s
  changed_when: true

- name: Wait for the K3s server to be ready
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: 120

- name: Wait for the node-token file to be written
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 60

- name: Read the node-token (agents join with this)
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: _k3s_node_token_raw

- name: Expose the node-token as a fact (consumed by k3s_agent via hostvars)
  ansible.builtin.set_fact:
    k3s_node_token: "{{ _k3s_node_token_raw.content | b64decode | trim }}"

# No "wait for the node to report Ready" task here on purpose: with
# --flannel-backend=none above, this node can't go Ready until a CNI
# exists — that wait now lives at the end of the `cilium` role instead,
# right after Cilium's actually installed (see 15-cilium.yml).
