# ============================================================================
# Exposes ArgoCD's own UI/API via K3s' bundled Traefik (Cloudflare DNS-01
# cert resolver, same as argocd/apps/otel-demo.yaml's Ingress) instead of
# only `kubectl port-forward`. Requires argocd-server to be running with
# server.insecure=true (set by this role, see tasks/main.yml) — Traefik
# terminates TLS at the edge, so argocd-server must serve plain HTTP
# internally rather than double-wrapping TLS.
#
# Requires a DNS record for argocd.homelab.bcochofel.com pointed at a K3s
# node IP (e.g. k3s-srv1, 192.168.68.25) — a manual step in the core repo's
# `dns_hosts`, not automated here since it's a different repo. See
# docs/ARGOCD.md.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.homelab.bcochofel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
  tls:
    - hosts:
        - argocd.homelab.bcochofel.com
