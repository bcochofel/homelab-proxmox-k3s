---
# tasks file for argocd — runs once, on the first K3s server. Installs
# ArgoCD via its official install manifest (pinned tag), waits for it to
# come up, then applies the one Application this repo's Ansible layer
# manages directly: the app-of-apps root (../../../argocd/root-app.yaml).
# Everything past that point is GitOps — see docs/ARGOCD.md.
#
# Plain kubectl, not a Kubernetes Ansible collection: K3s' install script
# already symlinks a working `kubectl` to /usr/local/bin, and every apply
# here is already idempotent (`kubectl apply` / `--dry-run=client | apply`),
# so a new collection dependency wouldn't buy anything — matches this
# repo's general "shell out to the tool already required" preference (see
# .pre-commit-config.yaml's packer_fmt/ansible_lint local hooks).

- name: Create the argocd namespace
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  register: _argocd_ns
  changed_when: "'created' in _argocd_ns.stdout or 'configured' in _argocd_ns.stdout"

- name: Apply the ArgoCD install manifest (pinned version)
  # --server-side: plain `kubectl apply` stashes the full previous manifest
  # in the kubectl.kubernetes.io/last-applied-configuration annotation, and
  # the applicationsets.argoproj.io CRD's schema is large enough to blow
  # past Kubernetes' 262144-byte annotation limit. Server-side apply tracks
  # field ownership instead, so the annotation is never written.
  # --force-conflicts: safe here — Ansible is the sole owner of these
  # objects, nothing else manages their fields.
  ansible.builtin.command: >
    kubectl apply --server-side --force-conflicts -n {{ argocd_namespace }}
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: _argocd_install
  changed_when: "'created' in _argocd_install.stdout or 'configured' in _argocd_install.stdout"

- name: Wait for the argocd-server deployment to roll out
  ansible.builtin.command: >
    kubectl -n {{ argocd_namespace }} rollout status deploy/argocd-server --timeout=300s
  changed_when: false

- name: Copy the app-of-apps root Application manifest to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../argocd/root-app.yaml"
    dest: /tmp/argocd-root-app.yaml
    mode: "0644"

- name: Apply the app-of-apps root Application
  ansible.builtin.command: kubectl apply -f /tmp/argocd-root-app.yaml
  register: _argocd_root_app
  changed_when: "'created' in _argocd_root_app.stdout or 'configured' in _argocd_root_app.stdout"

# ----------------------------------------------------------------------------
# Expose ArgoCD's own UI/API via Traefik instead of only `kubectl
# port-forward`. argocd-server terminates its own TLS by default; since
# Traefik terminates TLS at the edge (Cloudflare DNS-01, same as
# otel-demo's Ingress), argocd-server needs server.insecure=true so it
# serves plain HTTP internally rather than double-wrapping TLS.
# ----------------------------------------------------------------------------
- name: Configure argocd-server to serve plain HTTP (Traefik terminates TLS at the edge)
  ansible.builtin.command: >
    kubectl -n {{ argocd_namespace }} patch configmap argocd-cmd-params-cm
    --type merge -p '{"data":{"server.insecure":"true"}}'
  register: _argocd_insecure
  changed_when: "'patched' in _argocd_insecure.stdout and 'not patched' not in _argocd_insecure.stdout"

- name: Restart argocd-server to pick up the insecure setting
  ansible.builtin.command: kubectl -n {{ argocd_namespace }} rollout restart deploy/argocd-server
  when: _argocd_insecure is changed
  changed_when: true

- name: Wait for argocd-server to roll out after the restart
  ansible.builtin.command: >
    kubectl -n {{ argocd_namespace }} rollout status deploy/argocd-server --timeout=300s
  when: _argocd_insecure is changed
  changed_when: false

- name: Copy the ArgoCD server Ingress manifest to the server
  ansible.builtin.copy:
    src: argocd-ingress.yaml
    dest: /tmp/argocd-ingress.yaml
    mode: "0644"

- name: Apply the ArgoCD server Ingress (Traefik, Cloudflare DNS-01)
  ansible.builtin.command: kubectl apply -f /tmp/argocd-ingress.yaml
  register: _argocd_ingress
  changed_when: "'created' in _argocd_ingress.stdout or 'configured' in _argocd_ingress.stdout"
