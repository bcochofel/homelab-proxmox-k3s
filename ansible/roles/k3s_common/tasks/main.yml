---
# tasks file for k3s_common — host prerequisites shared by every K3s node
# (server and agent alike), run before k3s_server/k3s_agent install K3s
# itself. Idempotent throughout: safe to re-run against an already-prepped
# host.

- name: Disable swap for this boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Remove swap entries from /etc/fstab (persist across reboots)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules K3s' embedded containerd/networking needs
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Set sysctls K3s needs (bridged traffic through iptables, IP forwarding)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-k3s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
