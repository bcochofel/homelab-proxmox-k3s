---
# tasks file for k3s_agent — joins a host to the K3s cluster in agent
# (worker) mode via the official install script. Idempotent via
# `creates=`. Requires the k3s_server play to have already run in this
# same `ansible-playbook` invocation — it consumes k3s_node_token via
# hostvars, not a lookup against saved state.

- name: Determine the first K3s server's URL and token
  ansible.builtin.set_fact:
    _k3s_server_host: "{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}"
    _k3s_server_token: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"

- name: Download and run the K3s agent install script
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      INSTALL_K3S_EXEC="agent" \
      K3S_URL="https://{{ _k3s_server_host }}:6443" \
      K3S_TOKEN="{{ _k3s_server_token }}" \
      sh -
  args:
    creates: /usr/local/bin/k3s-agent
  changed_when: true
