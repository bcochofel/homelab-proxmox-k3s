---
# ============================================================================
# Hand-authored tuning. NOT generated by Terraform.
# ============================================================================

# K3s install script + pinned version — https://get.k3s.io.
# Verified current stable via `gh api repos/k3s-io/k3s/releases/latest`
# (2026-08-12) — re-check before bumping, same discipline as the
# Caddy/CoreDNS/Pihole version pins in the core/elastic repos.
k3s_install_url: https://get.k3s.io
k3s_version: "v1.36.3+k3s1"

# ArgoCD install manifest + pinned tag.
# Verified via `gh api repos/argoproj/argo-cd/releases/latest` (2026-08-12).
argocd_version: "v3.5.1"
argocd_namespace: argocd

# Traefik (K3s' bundled default ingress controller — not a separate
# install) gets its own Cloudflare DNS-01 cert resolver, independent of
# the core repo's Caddy. Terminates TLS itself for in-cluster Ingresses
# (starting with the otel-demo frontend) — see docs/ARGOCD.md.
# cloudflare_api_token comes from secrets.yaml via ansible/.envrc
# (CLOUDFLARE_API_TOKEN) — a *separate*, separately-scoped Cloudflare
# token from the one core's Caddy uses, same least-privilege-per-consumer
# reasoning as that repo's CLAUDE.md; it just happens to share the same
# env var / secrets.yaml key name since each repo's secrets.yaml is its
# own independent file.
traefik_cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
traefik_cloudflare_secret_name: traefik-cloudflare-api-token
# Not a secret — the ACME account contact, same pattern as core's
# letsencrypt_email.
traefik_acme_email: "bruno.cochofel@gmail.com"
