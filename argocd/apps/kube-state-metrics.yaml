# ============================================================================
# kube-state-metrics — required by the elastic-agent chart's built-in
# `clusterWide` preset for Kubernetes "state" metrics (pod/deployment/node
# state, etc.). Not bundled with Elastic Agent itself; deployed as its own
# app so Elastic Agent's Kubernetes integration has something to scrape.
# See ../../CLAUDE.md's "Decisions that are deliberate".
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: "8.3.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
