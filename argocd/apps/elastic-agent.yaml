# ============================================================================
# Elastic Agent (Fleet-managed) — feeds this cluster's node/pod logs and
# Kubernetes state metrics (via kube-state-metrics.yaml) into the shared
# homelab-proxmox-elastic stack, enrolling against that repo's Fleet Server
# (https://192.168.68.33:8220) under its k3s-cluster agent policy. See
# ../../CLAUDE.md's "Decisions that are deliberate".
#
# The enrollment token and Fleet CA cert are NOT here — they're pulled from
# the elastic-agent-fleet Secret in the elastic-system namespace, created
# by Ansible's elastic_agent_secret role (playbooks/35-elastic-agent-secret.yml)
# before this app ever syncs. Same split as Traefik's Cloudflare token vs.
# otel-demo's chart: secrets are Ansible's job, GitOps apps consume them.
#
# agent.presets: the chart's elasticagent.init.fleet helper disables every
# preset except whichever one agent.fleet.preset names as soon as
# agent.fleet.enabled=true — Fleet-managed mode only supports one preset
# per Helm release, unlike standalone mode where perNode+clusterWide both
# ship by default. This release covers perNode (the default); a second
# release with agent.fleet.preset: clusterWide is needed for cluster-wide
# state metrics — see TODO.md, not yet added.
#
# kube-state-metrics.enabled: false — the chart bundles kube-state-metrics
# as an enabled-by-default optional dependency, which collided with the
# separate kube-state-metrics.yaml app managing the exact same objects
# (both apps' selfHeal kept fighting over ownership). Disabled here so
# only kube-state-metrics.yaml owns them.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: elastic-agent
    targetRevision: "9.4.2"
    helm:
      valuesObject:
        kube-state-metrics:
          enabled: false
        agent:
          fleet:
            enabled: true
            url: "https://192.168.68.33:8220"
            tokenFromSecret:
              name: elastic-agent-fleet
              key: token
            ca:
              valueFromSecret:
                name: elastic-agent-fleet
                key: ca.crt
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
