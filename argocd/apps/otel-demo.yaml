# ============================================================================
# OpenTelemetry Demo — routes traces/metrics/logs to the homelab-proxmox-
# elastic repo's apm-server VM (Fleet-managed Elastic Agent + APM
# integration, 192.168.68.34:8200) instead of the chart's bundled Jaeger/
# Prometheus/OpenSearch/Grafana. See ../../docs/ARGOCD.md for the full
# rationale and how to verify data is landing in Kibana.
#
# apm-server endpoint is plain HTTP, no auth: the elastic repo's Fleet APM
# integration package policy (ansible/roles/fleet_bootstrap/tasks/main.yml)
# only sets `host`, no `secret_token`/TLS — confirmed by reading that repo,
# not assumed. If that ever changes (secret_token or TLS added on the
# apm-server side), this exporter needs a matching Authorization header /
# certificate — see the TODO.md entry for this app.
#
# Exposed via K3s' bundled Traefik (configured by ansible/roles/traefik
# with its own Cloudflare DNS-01 cert resolver, independent of the core
# repo's Caddy) at otel-demo.homelab.bcochofel.com. Requires a DNS record
# for that hostname pointed at a K3s node IP (e.g. k3s-srv1,
# 192.168.68.25) — a manual step in the core repo's `dns_hosts`
# (`inventory/group_vars/dns.yml`), not automated here since it's a
# different repo. See docs/ARGOCD.md.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-demo
    targetRevision: "0.41.0"
    helm:
      valuesObject:
        # Bundled backends disabled — the elastic repo's Elasticsearch +
        # Kibana + APM integration is the observability backend instead.
        # Also meaningfully shrinks this app's footprint on a 2-agent/
        # 4GB-each cluster (opensearch in particular is memory-hungry).
        jaeger:
          enabled: false
        prometheus:
          enabled: false
        opensearch:
          enabled: false
        grafana:
          enabled: false

        opentelemetry-collector:
          config:
            exporters:
              otlphttp/elastic:
                endpoint: "http://192.168.68.34:8200"
                tls:
                  insecure: true
              # Remove the now-dangling exporters that pointed at the
              # disabled backends above — the collector fails to start if
              # any declared exporter isn't referenced by a pipeline, so
              # these must be nulled out, not just left unreferenced.
              otlp_grpc/jaeger: null
              otlp_http/prometheus: null
              opensearch: null
            service:
              pipelines:
                traces:
                  exporters: [otlphttp/elastic, debug, span_metrics]
                metrics:
                  exporters: [otlphttp/elastic, debug]
                logs:
                  exporters: [otlphttp/elastic, debug]

        components:
          # frontend-proxy (not frontend directly) is the demo's actual
          # entry point — it fronts the Next.js frontend AND proxies
          # /otlp-http/* to the collector for browser-side telemetry, so
          # the Ingress targets this component's service (port 8080).
          frontend-proxy:
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
              hosts:
                - host: otel-demo.homelab.bcochofel.com
                  paths:
                    - path: /
                      pathType: Prefix
                      port: 8080
              # No secretName: the certresolver annotation above means
              # Traefik manages the cert itself via ACME, it doesn't read
              # a cert from a Kubernetes TLS Secret here.
              tls:
                - hosts:
                    - otel-demo.homelab.bcochofel.com
          # The chart's default value for this env var assumes browser
          # access via `kubectl port-forward` (`localhost:8080`) — wrong
          # once real Ingress access replaces that. Must match the
          # frontend-proxy Ingress host above exactly, or browser-side
          # traces silently stop reaching the collector (the request goes
          # to the browser's own localhost instead of this hostname).
          frontend:
            envOverrides:
              - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                value: "https://otel-demo.homelab.bcochofel.com/otlp-http/v1/traces"
          # image-provider and telemetry-docs both crash-loop on this
          # cluster: their baked-in nginx.conf.template (src/image-provider
          # and src/telemetry-docs in the opentelemetry-demo repo) listens
          # on both IPv4 and `[::]` (IPv6), and these K3s nodes have no
          # IPv6 stack at all (no /proc/net/if_inet6) — nginx fails with
          # "socket() [::]:PORT failed (97: Address family not supported by
          # protocol)". Fix: mount a copy of the same template with the
          # `listen [::]:...;` line removed at /nginx.conf.template, the
          # exact path each image's entrypoint envsubst's into
          # /etc/nginx/nginx.conf before starting nginx — everything else
          # byte-for-byte identical to upstream's template.
          image-provider:
            mountedConfigMaps:
              - name: nginx-conf-template
                mountPath: /nginx.conf.template
                subPath: nginx.conf.template
                data:
                  nginx.conf.template: |
                    load_module modules/ngx_otel_module.so;

                    pid /tmp/nginx.pid;

                    events {
                        worker_connections 1024;
                    }

                    http {
                        otel_exporter {
                            endpoint ${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_GRPC};
                        }
                        otel_trace on;
                        otel_trace_context propagate;
                        otel_service_name ${OTEL_SERVICE_NAME};
                        otel_span_name image-provider;


                        include mime.types;
                        sendfile on;
                        server {
                            listen ${IMAGE_PROVIDER_PORT};

                            resolver 127.0.0.11;
                            autoindex off;

                            server_name _;
                            server_tokens off;

                            root /static;
                            gzip_static on;

                            location /status {
                                stub_status on;
                                access_log  on;
                                allow all;
                            }
                        }
                    }
          telemetry-docs:
            mountedConfigMaps:
              - name: nginx-conf-template
                mountPath: /nginx.conf.template
                subPath: nginx.conf.template
                data:
                  nginx.conf.template: |
                    load_module modules/ngx_otel_module.so;

                    pid /tmp/nginx.pid;

                    events {
                        worker_connections 1024;
                    }

                    http {
                        # Map URIs to low-cardinality route patterns
                        map $uri $otel_route {
                            ~^/attributes/[^/]+\.html$  "/attributes/{business_domain}";
                            ~^/services/[^/]+\.html$    "/services/{service_name}";
                            ~^/index\.html$             "/index";
                            ~^/$                        "/";
                            default                     $uri;
                        }

                        otel_exporter {
                            endpoint ${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_GRPC};
                            interval 5s;
                            batch_size 256;
                            batch_count 2;
                        }
                        otel_trace on;
                        otel_trace_context propagate;
                        otel_service_name ${OTEL_SERVICE_NAME};
                        otel_span_name "$request_method $otel_route";


                        include mime.types;
                        sendfile on;
                        server {
                            listen ${TELEMETRY_DOCS_PORT};

                            resolver 127.0.0.11;
                            autoindex off;

                            server_name _;
                            server_tokens off;

                            root /static;
                            gzip_static on;

                            # Don't trace static assets
                            location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot|map|json|xml|gz)$ {
                                otel_trace off;
                                expires 1y;
                                add_header Cache-Control "public, immutable";
                            }

                            location /assets/ {
                                otel_trace off;
                                expires 1y;
                                add_header Cache-Control "public, immutable";
                            }

                            location /search/ {
                                otel_trace off;
                            }

                            location /status {
                                otel_trace off;
                                stub_status on;
                                access_log  on;
                                allow all;
                            }
                        }
                    }
          # flagd-ui (the flagd-ui sidecar in this pod) is Elixir/Phoenix,
          # same IPv6-less-node problem as image-provider/telemetry-docs
          # above but a different mechanism: its HTTP listener address is
          # hardcoded (not env-driven) in the compiled release's
          # config/runtime.exs, evaluated fresh at every boot from
          # /app/releases/0.1.1/runtime.exs — mounting a replacement there
          # works the same way as the nginx templates. Only functional
          # change from upstream (open-telemetry/opentelemetry-demo's
          # src/flagd-ui/config/runtime.exs): `ip: {0, 0, 0, 0, 0, 0, 0,
          # 0}` (IPv6 wildcard) -> `ip: {0, 0, 0, 0}` (IPv4 wildcard) —
          # the upstream file's dead SSL/mailer example comments are
          # trimmed here too, but that's not a behavior change.
          #
          # sidecarContainers is a list, so this whole block — not just
          # the new volumeMount — has to be reproduced from the chart's
          # default values.yaml: Helm replaces list values wholesale on
          # override, it doesn't merge list items by key.
          flagd:
            mountedConfigMaps:
              - name: flagd-ui-runtime-config
                mountPath: /app/releases/0.1.1/runtime.exs
                subPath: runtime.exs
                data:
                  runtime.exs: |
                    # Copyright The OpenTelemetry Authors
                    # SPDX-License-Identifier: Apache-2.0

                    import Config

                    # config/runtime.exs is executed for all environments, including
                    # during releases. It is executed after compilation and before the
                    # system starts, so it is typically used to load production configuration
                    # and secrets from environment variables or elsewhere. Do not define
                    # any compile-time configuration in here, as it won't be applied.
                    # The block below contains prod specific runtime configuration.

                    # ## Using releases
                    #
                    # If you use `mix release`, you need to explicitly enable the server
                    # by passing the PHX_SERVER=true when you start it:
                    #
                    #     PHX_SERVER=true bin/flagd_ui start
                    #
                    # Alternatively, you can use `mix phx.gen.release` to generate a `bin/server`
                    # script that automatically sets the env var above.
                    if System.get_env("PHX_SERVER") do
                      config :flagd_ui, FlagdUiWeb.Endpoint, server: true
                    end

                    if config_env() == :prod do
                      # The secret key base is used to sign/encrypt cookies and other secrets.
                      # A default value is used in config/dev.exs and config/test.exs but you
                      # want to use a different value for prod and you most likely don't want
                      # to check this value into version control, so we use an environment
                      # variable instead.
                      secret_key_base =
                        System.get_env("SECRET_KEY_BASE") ||
                          raise """
                          environment variable SECRET_KEY_BASE is missing.
                          You can generate one by calling: mix phx.gen.secret
                          """

                      otel_endpoint =
                        System.get_env("OTEL_EXPORTER_OTLP_ENDPOINT") ||
                          raise """
                          environment variable OTEL_EXPORTER_OTLP_ENDPOINT is missing.
                          """

                      host = System.get_env("PHX_HOST") || "example.com"
                      port = String.to_integer(System.get_env("FLAGD_UI_PORT") || "4000")

                      config :flagd_ui, :dns_cluster_query, System.get_env("DNS_CLUSTER_QUERY")

                      config :flagd_ui, FlagdUiWeb.Endpoint,
                        url: [host: host, port: 443, scheme: "https"],
                        http: [
                          # Bind IPv4 only — these K3s nodes have no IPv6 stack at all.
                          ip: {0, 0, 0, 0},
                          port: port
                        ],
                        check_origin: false,
                        secret_key_base: secret_key_base

                      config :opentelemetry, :processors,
                        otel_batch_processor: %{
                          exporter: {:opentelemetry_exporter, %{endpoints: [otel_endpoint]}}
                        }
                    end
            sidecarContainers:
              - name: flagd-ui
                useDefault:
                  env: true
                service:
                  port: 4000
                env:
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://$(OTEL_COLLECTOR_NAME):4318
                  - name: FLAGD_UI_PORT
                    value: "4000"
                  - name: SECRET_KEY_BASE
                    value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
                  - name: PHX_HOST
                    value: localhost
                  - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
                    value: service.criticality=low
                resources:
                  limits:
                    memory: 250Mi
                volumeMounts:
                  - name: config-rw
                    mountPath: /app/data
                  - name: flagd-ui-runtime-config
                    mountPath: /app/releases/0.1.1/runtime.exs
                    subPath: runtime.exs
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
